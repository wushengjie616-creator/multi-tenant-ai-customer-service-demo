<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>租户登录与注册·教育 AI 平台</title><link rel="stylesheet" href="/ui/styles.css"></head>
<body><main class="shell wide">
  <nav class="topbar"><a class="brand" href="/ui/"><span class="brand-mark">AI</span><span>租户接入中心</span></a><a class="nav-link" href="/ui/">返回首页</a></nav>
  <section class="hero compact-hero"><div class="eyebrow">TENANT ACCOUNT</div><h1>注册新租户 / 登录已有租户</h1><p class="lead">录制新建租户流程请选择“注册新租户”；已有机构请选择“登录已有租户”。</p></section>
  <section class="onboarding-layout">
    <div class="panel onboarding-intro"><span class="eyebrow">TENANT ACCESS</span><h1>建立你的教育服务空间</h1><p class="lead">注册新机构或登录已有租户。认证完成后进入独立工作台，不与虚拟租户演示数据互通。</p><div class="builder-points"><div><strong>01</strong><span>独立租户数据</span></div><div><strong>02</strong><span>按需开启模块</span></div><div><strong>03</strong><span>登录后进入工作台</span></div></div><div class="auth-switch"><button id="show-register" class="button" type="button">注册新租户</button><button id="show-login" class="button secondary" type="button">登录已有租户</button></div></div>
    <form id="create-tenant-form" class="panel tenant-builder"><span class="eyebrow">REGISTER</span><h2>注册新租户</h2><div class="form-grid two-fields"><label>租户/机构名称<input id="tenant-name-input" required></label><label>管理员姓名<input id="admin-name-input" value="陈老师" required></label><label>管理员邮箱<input id="admin-email-input" type="email" required></label><label>管理员密码<input id="admin-password-input" type="password" value="StrongDemo123!" minlength="8" required></label></div>
      <div class="feature-picker-head"><div><span class="eyebrow">FEATURES</span><h2>选择功能</h2></div><button id="select-all-features" class="text-button" type="button">全选</button></div>
      <div class="feature-picker">
        <label class="feature-option"><input type="checkbox" value="knowledge" checked><span>📚</span><strong>知识库</strong><small>文件/文本导入、分块与实体抽取</small></label><label class="feature-option"><input type="checkbox" value="assistant" checked><span>🤖</span><strong>AI 客服</strong><small>RAG 问答与多轮对话</small></label><label class="feature-option"><input type="checkbox" value="learning"><span>🎓</span><strong>学习中心</strong><small>课表与学习报告</small></label><label class="feature-option"><input type="checkbox" value="finance"><span>🧾</span><strong>财务中心</strong><small>订单、账单、发票、退费与余额</small></label><label class="feature-option"><input type="checkbox" value="services"><span>⚙️</span><strong>办事服务</strong><small>请假、课程提醒与续费</small></label><label class="feature-option"><input type="checkbox" value="reminders"><span>⏰</span><strong>提醒中心</strong><small>一次性与周期提醒</small></label><label class="feature-option"><input type="checkbox" value="handoff"><span>🎧</span><strong>人工服务</strong><small>AI 转坐席与上下文摘要</small></label><label class="feature-option"><input type="checkbox" value="operations" checked><span>🛡️</span><strong>运营中心</strong><small>用户、审计日志与死信恢复</small></label>
      </div><button class="button large" type="submit">注册并进入租户工作台</button><div id="create-status" class="status"></div>
    </form>
    <form id="tenant-login-form" class="panel tenant-builder" hidden><span class="eyebrow">LOGIN</span><h2>登录已有租户</h2><p class="hint">使用注册成功时保存的租户 ID、管理员邮箱和密码。</p><div class="form-grid"><label>租户 ID<input id="login-tenant-id" required placeholder="租户 UUID"></label><label>管理员邮箱<input id="login-email" type="email" required></label><label>密码<input id="login-password" type="password" required></label><button class="button large" type="submit">登录并进入工作台</button></div><div id="login-status" class="status"></div></form>
  </section>
</main><script src="/ui/common.js?v=20260924-3"></script><script src="/ui/tenant-auth.js?v=20260924-3"></script></body></html>
